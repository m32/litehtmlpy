<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html xmlns:xs="http://www.w3.org/2001/XMLSchema">

<head>
    <style type="text/css">
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Arial", sans-serif;
            font-size: 11pt;
            margin: 0;
            padding: 1px 5%;
        }

        div.deklaracja {
            width: 100%;
            min-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .normalna {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
            border: 1px solid black;
        }

        .wypelniane {
            background-color: white;
            border: 1px solid black;
            font-size: 1.2em;
            padding: 1px;
            vertical-align: top;
            text-align: left;
        }

        .opisrubryki {
            font-size: 0.5em;
            margin-bottom: 0.2em;
            text-align: left;
            font-weight: bold;
            text-transform: none;
        }
    </style>
</head>

<body>
    <div class="deklaracja">
    <table class="normalna">
        <tr>
            <td class="wypelniane" style="width: 33%">
                <div class="opisrubryki">16. Nazwisko</div>
                <div class="wypelniane">Nazwisko</div>
            </td>
            <td class="wypelniane" style="width: 33%">
                <div class="opisrubryki">17. Pierwsze Imie</div>
                <div class="wypelniane">Imie</div>
            </td>
            <td class="wypelniane" style="width: 34%">
                <div class="opisrubryki">18. Data urodzenia</div>
                <div class="wypelniane">1234-56-78</div>
            </td>
        </tr>
    </table>
    </div>
</body>

</html>
